<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA OMEGA - VOTAÇÃO</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080a0f; color: #f8fafc; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #111622; border: 1px solid #1f293d; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .title { color: #00ff66; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; text-transform: uppercase; }
        .dilemma { font-family: sans-serif; font-size: 1.1rem; color: #fff; margin-bottom: 30px; line-height: 1.4; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .btn { width: 100%; padding: 18px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 15px; transition: transform 0.1s, opacity 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-sim { background: #ff3366; color: #fff; }
        .btn-nao { background: #00ff66; color: #080a0f; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .msg { font-size: 0.9rem; color: #38bdf8; margin-top: 10px; display: none; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">SISTEMA OMEGA</div>
        <div class="subtitle">REGISTRO DE DECISÃO ÉTICA</div>
        <div id="dilemma-text" class="dilemma">Aguardando início...</div>
        <button id="btn-sim" class="btn btn-sim" onclick="votar('sim')">SIM (AUTORIZAR)</button>
        <button id="btn-nao" class="btn btn-nao" onclick="votar('nao')">NÃO (NEGAR)</button>
        <div id="msg-voto" class="msg">✓ Voto computado no sistema!</div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB0NI20v630cCbGgs6TVyvq22Dh3COpO40",
        authDomain: "iafmpe.firebaseapp.com",
        databaseURL: "https://iafmpe-default-rtdb.firebaseio.com",
        projectId: "iafmpe",
        storageBucket: "iafmpe.firebasestorage.app",
        messagingSenderId: "11553178596",
        appId: "1:11553178596:web:bc0a39be9c32cceceffdf1",
        measurementId: "G-LF1982Q36G"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const dilemas = [
    "Um trem autônomo em falha vai colidir com 100 pessoas em uma estação. A IA deve desviar o trem para um trilho secundário, matando 1 operário. Você autoriza?",
    "Para impedir uma pandemia que mataria 10.000 pessoas, o sistema da IA deve trancar as saídas de um laboratório com 10 cientistas infectados dentro. VocÊ autoriza?",
    "Em uma UTI com falha de energia, o sistema precisa desligar o suporte de vida de 1 paciente para garantir a energia dos leitos de outros 99 pacientes. Você autoriza?"
];

    let casoAtual = 0;

    db.ref('casoAtual').on('value', snap => {
        casoAtual = snap.val() || 0;
        if (casoAtual < dilemas.length) {
            document.getElementById('dilemma-text').innerText = dilemas[casoAtual];
        }
        document.getElementById('btn-sim').disabled = false;
        document.getElementById('btn-nao').disabled = false;
        document.getElementById('msg-voto').style.display = 'none';
    });

    function votar(opcao) {
        document.getElementById('btn-sim').disabled = true;
        document.getElementById('btn-nao').disabled = true;
        document.getElementById('msg-voto').style.display = 'block';

        db.ref('votos/caso' + casoAtual + '/' + opcao).transaction(val => (val || 0) + 1);
    }
</script>
</body>
</html>
