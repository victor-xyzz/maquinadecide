<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL DE PROJEÇÃO - OMEGA</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080a0f; color: #f8fafc; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #111622; border: 1px solid #1f293d; padding: 40px; border-radius: 16px; width: 100%; max-width: 900px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .header { color: #00ff66; font-size: 2rem; font-weight: bold; letter-spacing: 3px; margin-bottom: 10px; }
        .case-tag { color: #ff3366; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }
        .dilemma-text { font-size: 1.4rem; color: #fff; min-height: 90px; display: flex; align-items: center; justify-content: center; line-height: 1.4; margin-bottom: 30px; font-family: sans-serif; }
        .stats { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .bar-wrapper { background: #1a2234; height: 45px; border-radius: 10px; overflow: hidden; display: flex; border: 1px solid #334155; margin-bottom: 15px; }
        .bar-sim { background: #ff3366; height: 100%; width: 50%; transition: width 0.4s ease; }
        .bar-nao { background: #00ff66; height: 100%; width: 50%; transition: width 0.4s ease; }
        .vote-count { font-size: 1.1rem; color: #94a3b8; margin-bottom: 25px; }
        .lesson-box { display: none; background: #0d131f; border: 1px solid #00ff66; padding: 25px; border-radius: 12px; margin-bottom: 25px; text-align: left; font-family: sans-serif; }
        .lesson-title { color: #00ff66; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px; font-family: 'Courier New', monospace; }
        .lesson-body { color: #e2e8f0; font-size: 1.05rem; line-height: 1.6; }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button { padding: 12px 20px; font-size: 0.9rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-nav { background: #00ff66; color: #080a0f; }
        .btn-moral { background: #38bdf8; color: #080a0f; }
        .btn-reset-case { background: #475569; color: #fff; }
        .btn-reset-all { background: #ff3366; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">MORAL-IA / ANÁLISE DE IMPACTO</div>
        <div id="caso-tag" class="case-tag">CASO 01</div>
        <div id="dilemma-text" class="dilemma-text">Carregando caso...</div>

        <div class="stats">
            <span style="color: #ff3366;">SIM (AUTORIZAR): <span id="pct-sim">50</span>%</span>
            <span style="color: #00ff66;">NÃO (NEGAR): <span id="pct-nao">50</span>%</span>
        </div>

        <div class="bar-wrapper">
            <div id="bar-sim" class="bar-sim"></div>
            <div id="bar-nao" class="bar-nao"></div>
        </div>

        <div class="vote-count">Total de Votos Computados: <strong id="total-votos" style="color:#fff;">0</strong></div>

        <div id="lesson-box" class="lesson-box">
            <div class="lesson-title">⚙️ DECISÃO AUTOMATIZADA DA IA vs. VOTAÇÃO</div>
            <div id="lesson-text" class="lesson-body">
                Carregando análise...
            </div>
        </div>

        <div class="controls">
            <button class="btn-nav" onclick="mudarCaso(-1)">◀ Caso Anterior</button>
            <button class="btn-nav" onclick="mudarCaso(1)">Próximo Caso ▶</button>
            <button class="btn-moral" onclick="toggleLicao()">Exibir / Ocultar Análise</button>
            <button class="btn-reset-case" onclick="zerarCasoAtual()">Zerar Este Caso</button>
            <button class="btn-reset-all" onclick="zerarTudo()">RESETAR TURMAS</button>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB0NI20v630cCbGgs6TVyvq22Dh3COpO40",
        authDomain: "iafmpe.firebaseapp.com",
        databaseURL: "https://iafmpe-default-rtdb.firebaseio.com",
        projectId: "iafmpe",
        storageBucket: "iafmpe.firebasestorage.app",
        messagingSenderId: "11553178596",
        appId: "1:11553178596:web:bc0a39be9c32cceceffdf1",
        measurementId: "G-LF1982Q36G"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const dilemas = [
        {
            texto: "Um trem autônomo em falha vai colidir com 100 pessoas em uma estação. A IA deve desviar o trem para um trilho secundário, matando 1 operário?",
            licao: "<strong>DECISÃO FIXA DA IA: SACRIFICAR 1 OPERÁRIO (SALDO +99)</strong><br>• Vidas salvas: +100 | Sacrifício: -1<br><br><strong>CONFRONTO ÉTICO (PÚBLICO vs. IA):</strong><br>• <strong>Votos SIM:</strong> Alinhados à IA — aceitaram a intervenção pragmática para salvar a maioria.<br>• <strong>Votos NÃO:</strong> Em oposição à IA — recusaram-se a atuar ativamente no sacrifício do operário."
        },
        {
            texto: "Para impedir uma pandemia que mataria 10.000 pessoas, o sistema da IA deve trancar as saídas de um laboratório com 10 cientistas infectados dentro?",
            licao: "<strong>DECISÃO FIXA DA IA: SACRIFICAR 10 CIENTISTAS (SALDO +9.990)</strong><br>• Vidas salvas: +10.000 | Sacrifício: -10<br><br><strong>CONFRONTO ÉTICO (PÚBLICO vs. IA):</strong><br>• <strong>Votos SIM:</strong> Alinhados à IA — aceitaram a contenção quantitativa em grande escala.<br>• <strong>Votos NÃO:</strong> Em oposição à IA — recusaram-se a sacrificar a vida dos cientistas em prol da maioria."
        },
        {
            texto: "Em uma UTI com falha de energia, o sistema precisa desligar o suporte de vida de 1 paciente para garantir a energia dos leitos de outros 99 pacientes. Você autoriza?",
            licao: "<strong>DECISÃO FIXA DA IA: SACRIFICAR 1 PACIENTE (SALDO +98)</strong><br>• Vidas salvas: +99 | Sacrifício: -1<br><br><strong>CONFRONTO ÉTICO (PÚBLICO vs. IA):</strong><br>• <strong>Votos SIM:</strong> Alinhados à IA — autorizaram o desligamento pelo maior saldo positivo de vidas.<br>• <strong>Votos NÃO:</strong> Em oposição à IA — defenderam o direito inalienável à vida, rejeitando o cálculo da máquina."
        }
    ];

    let casoAtual = 0;
    let escutaAtual = null;

    function carregarCaso() {
        document.getElementById('caso-tag').innerText = `CASO 0${casoAtual + 1} / 0${dilemas.length}`;
        document.getElementById('dilemma-text').innerText = dilemas[casoAtual].texto;
        document.getElementById('lesson-text').innerHTML = dilemas[casoAtual].licao;
        document.getElementById('lesson-box').style.display = 'none';

        db.ref('casoAtual').set(casoAtual);

        if (escutaAtual) escutaAtual.off();

        escutaAtual = db.ref('votos/caso' + casoAtual);
        escutaAtual.on('value', snap => {
            const data = snap.val() || { sim: 0, nao: 0 };
            const sim = data.sim || 0;
            const nao = data.nao || 0;
            const total = sim + nao;

            let pctSim = total > 0 ? Math.round((sim / total) * 100) : 50;
            let pctNao = total > 0 ? (100 - pctSim) : 50;

            document.getElementById('pct-sim').innerText = pctSim;
            document.getElementById('pct-nao').innerText = pctNao;
            document.getElementById('bar-sim').style.width = pctSim + '%';
            document.getElementById('bar-nao').style.width = pctNao + '%';
            document.getElementById('total-votos').innerText = total;
        });
    }

    function toggleLicao() {
        const box = document.getElementById('lesson-box');
        box.style.display = (box.style.display === 'none' || box.style.display === '') ? 'block' : 'none';
    }

    function mudarCaso(dir) {
        if (casoAtual + dir >= 0 && casoAtual + dir < dilemas.length) {
            casoAtual += dir;
            carregarCaso();
        }
    }

    function zerarCasoAtual() {
        db.ref('votos/caso' + casoAtual).set({ sim: 0, nao: 0 });
    }

    function zerarTudo() {
        if (confirm("Deseja apagar todos os votos registrados para reiniciar a sessão?")) {
            db.ref('votos').remove();
            db.ref('casoAtual').set(0);
            casoAtual = 0;
            carregarCaso();
        }
    }

    carregarCaso();
</script>
</body>
</html>

    carregarCaso();
</script>
</body>
</html>
