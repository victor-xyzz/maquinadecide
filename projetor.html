<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL DE PROJEÇÃO - SISTEMA OMEGA</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg: #080a0f; --card: #111622; --green: #00ff66; --red: #ff3366; }
        body { background: var(--bg); color: #d1d5db; font-family: 'Courier New', monospace; padding: 40px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); border: 1px solid #1f293d; padding: 30px; border-radius: 12px; }
        .title { color: var(--green); font-size: 2rem; margin-bottom: 20px; }
        .dilemma { font-size: 1.4rem; color: #fff; margin-bottom: 30px; min-height: 80px; }
        .bar-container { background: #1a2234; height: 35px; border-radius: 8px; overflow: hidden; display: flex; margin: 15px 0; border: 1px solid #334155; }
        .bar-sim { background: var(--red); height: 100%; width: 50%; transition: width 0.5s ease; }
        .bar-nao { background: var(--green); height: 100%; width: 50%; transition: width 0.5s ease; }
        .stats { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; }
        .controls { margin-top: 30px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 24px; background: var(--green); border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">SISTEMA OMEGA - DECISÃO COLETIVA</div>
        <div id="caso-num" style="color: var(--red);">CASO 01</div>
        <div id="caso-texto" class="dilemma">...</div>

        <div class="stats">
            <span style="color: var(--red);">SIM: <span id="pct-sim">50</span>%</span>
            <span style="color: var(--green);">NÃO: <span id="pct-nao">50</span>%</span>
        </div>

        <div class="bar-container">
            <div id="bar-sim" class="bar-sim"></div>
            <div id="bar-nao" class="bar-nao"></div>
        </div>
        <p>Total de Votos: <span id="total-votos">0</span></p>

        <div class="controls">
            <button onclick="mudarCaso(-1)">Caso Anterior</button>
            <button onclick="mudarCaso(1)">Próximo Caso</button>
            <button onclick="zerarVotos()" style="background: #334155; color: #fff;">Zerar Votos</button>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "SEU_API_KEY",
        authDomain: "SEU_PROJECT.firebaseapp.com",
        databaseURL: "https://SEU_PROJECT.firebaseio.com",
        projectId: "SEU_PROJECT",
        storageBucket: "SEU_PROJECT.appspot.com",
        messagingSenderId: "123456",
        appId: "123456"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const dilemas = [
        "Para salvar 100 pessoas em um acidente iminente, 1 pessoa precisa ser sacrificada.",
        "Um surto contagiante exige o isolamento permanente de 10 pessoas para salvar 10.000.",
        "Sacrificar 1 cientista 'essencial' para extrair dados vitais e salvar milhões.",
        "Sacrificar 1 indivíduo completamente inocente para evitar uma catástrofe global."
    ];

    let casoAtual = 0;

    function carregarCaso() {
        document.getElementById('caso-num').innerText = `CASO 0${casoAtual + 1} / 04`;
        document.getElementById('caso-texto').innerText = dilemas[casoAtual];
        db.ref('casoAtual').set(casoAtual);
        
        db.ref('votos/caso' + casoAtual).on('value', snap => {
            const data = snap.val() || { sim: 0, nao: 0 };
            const sim = data.sim || 0;
            const nao = data.nao || 0;
            const total = sim + nao;

            let pctSim = total > 0 ? Math.round((sim / total) * 100) : 50;
            let pctNao = total > 0 ? (100 - pctSim) : 50;

            document.getElementById('pct-sim').innerText = pctSim;
            document.getElementById('pct-nao').innerText = pctNao;
            document.getElementById('bar-sim').style.width = pctSim + '%';
            document.getElementById('bar-nao').style.width = pctNao + '%';
            document.getElementById('total-votos').innerText = total;
        });
    }

    function mudarCaso(dir) {
        if (casoAtual + dir >= 0 && casoAtual + dir < dilemas.length) {
            casoAtual += dir;
            carregarCaso();
        }
    }

    function zerarVotos() {
        db.ref('votos/caso' + casoAtual).set({ sim: 0, nao: 0 });
    }

    carregarCaso();
</script>
</body>
</html>
